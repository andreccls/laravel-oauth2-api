# DEV-ONLY credentials below. Never reuse them anywhere real.
name: laravel-oauth2-api

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:-base64:ZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiE=}  # DEV ONLY
  APP_URL: http://localhost:${API_PORT:-8088}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_DATABASE: oauth2_api
  DB_USERNAME: oauth2
  DB_PASSWORD: dev_only_db_password
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  LOG_CHANNEL: stderr
  API_RATE_LIMIT: ${API_RATE_LIMIT:-120}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev_only_root_password
      MYSQL_DATABASE: oauth2_api
      MYSQL_USER: oauth2
      MYSQL_PASSWORD: dev_only_db_password
    ports: ["127.0.0.1:${MYSQL_PORT:-3318}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev_only_root_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6389}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:  # Octane (RoadRunner) — the default runtime
    build: { context: ., target: octane }
    image: laravel-oauth2-api:octane
    environment: { <<: *app-env, RUN_MIGRATIONS: "true" }
    ports: ["127.0.0.1:${API_PORT:-8088}:8000"]
    volumes: [api-storage:/app/storage]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:  # runs `passport:purge` daily (see routes/console.php)
    image: laravel-oauth2-api:octane
    command: ["php", "artisan", "schedule:work"]
    healthcheck: { disable: true }  # the image healthcheck probes the HTTP port; this container serves none
    environment: *app-env
    volumes: [api-storage:/app/storage]
    depends_on:
      api: { condition: service_healthy }

  # ---- benchmark baseline (profile `bench`): nginx + php-fpm, same code, same DB/Redis
  fpm:
    profiles: [bench]
    build: { context: ., target: fpm }
    image: laravel-oauth2-api:fpm
    environment: *app-env
    volumes: [api-storage:/app/storage]
    depends_on:
      api: { condition: service_healthy }

  nginx:
    profiles: [bench]
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:${FPM_PORT:-8089}:80"]
    depends_on: [fpm]

  # ---- tooling (profile `tools`): tests, lint, coverage, artisan. Source bind-mounted, vendor in a named volume.
  tools:
    profiles: [tools]
    build: { context: ., target: dev }
    image: laravel-oauth2-api:dev
    working_dir: /app
    volumes:
      - .:/app
      - vendor:/app/vendor
      - composer-cache:/cache/composer
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /cache/composer
      PHP_MEMORY_LIMIT: 1G
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  mysql-data:
  api-storage:
  vendor:
  composer-cache:
